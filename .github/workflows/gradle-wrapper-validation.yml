name: "Validate Gradle Wrapper"
on:
  push:
    branches:
      - rebrand-package
  pull_request:
    branches:
      - rebrand-package

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3
